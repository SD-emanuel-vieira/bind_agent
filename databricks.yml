# This is a Databricks asset bundle definition for bind_agent.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bind_agent
  uuid: 72123b22-e7d3-42bd-bef4-2a2c3290a0b5

include:
  - resources/*.yml
  - resources/*/*.yml

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

artifacts:
  rag_wheel:
    type: whl
    path: .
    build: "pip wheel --no-deps -w dist ."
    
# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: "Unity Catalog catalog name"
  schema:
    description: "Unity Catalog schema name"
  vs_index_full_name:
    description: "Full name of the vector search index"
  llm_endpoint:
    description: "LLM serving endpoint"
  uc_model_name:
    description: "Unity Catalog model name"
  vs_endpoint:
    default: bind_agent_vs
  embed_endpoint:
    default: databricks-bge-large-en
  top_k_candidates:
    default: "120"
  lex_fallback_limit:
    default: "40"
  top_k_final:
    default: "8"
  max_context_chars:
    default: "60000"
  rerank_snippet_chars:
    default: "3400"
  temperature_rerank:
    default: "0.0"
  temperature_answer:
    default: "0.2"
  max_tokens_answer:
    default: "900"
  max_retries:
    default: "3"
  retry_sleep_secs:
    default: "1.0"
  model_serving_endpoint:
    default: bind_agent_rag_agent
    
targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-56f60291-144c.cloud.databricks.com
    variables:
      catalog: bind_agent
      schema: docs
      vs_index_full_name: bind_agent.docs.pdf_chunks_vs_idx
      llm_endpoint: databricks-llama-4-maverick
      delta_log_table: bind_agent.docs.silver_excel
      sql_warehouse: 1b632a5315f277d9
      uc_model_name: bind_agent.docs.rag_agent

  dev-bind:
    mode: development
    default: false
    workspace:
      host: https://bind-dev.cloud.databricks.com
    variables:
      catalog: demo
      schema: docs
      vs_index_full_name: bind_agent.docs.pdf_chunks_vs_idx
      llm_endpoint: databricks-gpt-5-2
      delta_log_table: demo.docs.silver_excel
      sql_warehouse: 1b632a5315f277d9
      uc_model_name: demo.docs.rag_agent

