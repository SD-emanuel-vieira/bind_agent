# This is a Databricks asset bundle definition for bind_agent.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bind_agent
  uuid: 72123b22-e7d3-42bd-bef4-2a2c3290a0b5

include:
  - resources/*.yml
  - resources/*/*.yml

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

artifacts:
  rag_wheel:
    type: whl
    path: .
    build: "pip wheel --no-deps -w dist ."
    
# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: "Unity Catalog catalog name"
  schema:
    description: "Unity Catalog schema name"
  vs_index_full_name:
    description: "Full name of the vector search index"
  llm_endpoint:
    description: "LLM serving endpoint"
  uc_model_name:
    description: "Unity Catalog model name"
  vs_endpoint:
    default: bind_agent_vs
  embed_endpoint:
    default: databricks-bge-large-en
  top_k_candidates:
    default: "120"
  lex_fallback_limit:
    default: "40"
  top_k_final:
    default: "8"
  max_context_chars:
    default: "60000"
  rerank_snippet_chars:
    default: "3400"
  temperature_rerank:
    default: "0.0"
  temperature_answer:
    default: "0.2"
  max_tokens_answer:
    default: "900"
  max_retries:
    default: "3"
  retry_sleep_secs:
    default: "1.0"
  model_serving_endpoint:
    default: bind_agent_rag_agent
  rag_sql_table:
    description: "Delta table used for SQL queries in the RAG"
  delta_log_table:
    description: "Delta table used for SQL log"
  sql_warehouse:
    description: "SQL warehouse ID"
  serving_sp_name:
    description: "Service prinicpal del agente"   
  serving_sp_secret_scope:
    description: "Secret scope donde está guardado el secret para autenticacion"   
  serving_sp_secret_key:
    description: "Secret key donde está guardado el secret para autenticacion"     
  create_sp_secret:
    description: "Flag dedicado para crear el secret en caso de que no exista y guardarlo en el secret scope"

targets:
  # ---------------------------------------------------------------
  # dev: deploy y ejecución como tu usuario personal
  # Uso: databricks bundle deploy -t dev --profile dev-sso
  # ---------------------------------------------------------------
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-56f60291-144c.cloud.databricks.com
    variables:
      catalog: bind_agent
      schema: docs
      vs_index_full_name: bind_agent.docs.pdf_chunks_vs_idx
      llm_endpoint: databricks-llama-4-maverick
      rag_sql_table: bind_agent.docs.silver_excel
      delta_log_table: bind_agent.docs.rag_query_log
      sql_warehouse: 1b632a5315f277d9
      uc_model_name: bind_agent.docs.rag_agent
      serving_sp_secret_scope: bind-agent-secrets
      serving_sp_secret_key: sp-bind-rag-agent-client-secret
      create_sp_secret: False

  # ---------------------------------------------------------------
  # dev-sp: deploy y ejecución como el Service Principal
  # Uso: databricks bundle deploy -t dev-sp --profile dev-sso
  # ---------------------------------------------------------------
  dev-sp:
    default: false
    workspace:
      host: https://dbc-56f60291-144c.cloud.databricks.com
      root_path: /Workspace/Users/52db1d3b-bab4-49e7-a116-6f65347fed66/.bundle/${bundle.name}/${bundle.target}
    resources:
      jobs:
        deploy_rag_agent_job:
          run_as:
            service_principal_name: 52db1d3b-bab4-49e7-a116-6f65347fed66
    variables:
      catalog: bind_agent
      schema: docs
      vs_index_full_name: bind_agent.docs.pdf_chunks_vs_idx
      llm_endpoint: databricks-llama-4-maverick
      rag_sql_table: bind_agent.docs.silver_excel
      delta_log_table: bind_agent.docs.rag_query_log
      sql_warehouse: 1b632a5315f277d9
      uc_model_name: bind_agent.docs.rag_agent
      serving_sp_secret_scope: bind-agent-secrets
      serving_sp_secret_key: sp-bind-rag-agent-client-secret
      create_sp_secret: False

  # ---------------------------------------------------------------
  # dev-bind: ambiente de desarrollo en workspace BIND
  # ---------------------------------------------------------------
  dev-bind:
    mode: development
    default: false
    workspace:
      host: https://bind-dev.cloud.databricks.com
    variables:
      catalog: dev_sandbox
      schema: docs
      vs_index_full_name: dev_sandbox.docs.pdf_chunks_vs_idx
      llm_endpoint: databricks-gpt-5-1
      rag_sql_table: dev_sandbox.docs.silver_excel
      delta_log_table: dev_sandbox.docs.rag_query_log
      sql_warehouse: 258ac74472ffef98
      uc_model_name: dev_sandbox.docs.rag_agent
      serving_sp_secret_scope: bind-agent-secrets
      serving_sp_secret_key: sp-bind-rag-agent-client-secret
      create_sp_secret: False

  # ---------------------------------------------------------------
  # dev-sp: deploy y ejecución como el Service Principal
  # dev-bind: ambiente de desarrollo en workspace BIND
  # ---------------------------------------------------------------
  dev-sp-bind:
    default: false
    workspace:
      host: https://bind-dev.cloud.databricks.com
      root_path: /Workspace/Users/3058ba52-ce3d-47f2-8603-0aaf9f333091/.bundle/${bundle.name}/${bundle.target}
    resources:
      jobs:
        deploy_rag_agent_job:
          run_as:
            service_principal_name: 3058ba52-ce3d-47f2-8603-0aaf9f333091
    variables:
      catalog: dev_sandbox
      schema: docs
      vs_index_full_name: dev_sandbox.docs.pdf_chunks_vs_idx
      llm_endpoint: databricks-gpt-5-1
      rag_sql_table: dev_sandbox.docs.silver_excel
      delta_log_table: dev_sandbox.docs.rag_query_log
      sql_warehouse: 258ac74472ffef98
      uc_model_name: dev_sandbox.docs.rag_agent
      serving_sp_name: sp-agent-serving-executor
      serving_sp_secret_scope: bind-agent-secrets
      serving_sp_secret_key: sp-bind-rag-agent-client-secret
      create_sp_secret: True