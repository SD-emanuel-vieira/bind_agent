[project]
name = "bind_agent"
version = "0.1.0"
authors = [{ name = "emanuel.vieira@sunnydata.ai" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "databricks-vectorsearch",
    "mlflow",
    "requests",
]

[dependency-groups]
dev = [
    "pytest",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
]

[project.scripts]
main = "bind_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bind_rag_agent"]

[tool.black]
line-length = 125
